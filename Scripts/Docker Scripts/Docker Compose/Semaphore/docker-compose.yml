name: semaphore
services:
    semaphore:
        ports:
            - 3000:3000
        image: semaphoreui/semaphore:latest
        restart: always
        environment:
            SEMAPHORE_DB_DIALECT: sqlite
            SEMAPHORE_ADMIN: ADMIN
            SEMAPHORE_ADMIN_PASSWORD: CHANGEME
            SEMAPHORE_ADMIN_NAME: ADMIN
            SEMAPHORE_ADMIN_EMAIL: ADMIN@LOCALHOST
            # Run schedules on local time instead of UTC
            SEMAPHORE_SCHEDULE_TIMEZONE: America/Los_Angeles
            # Two-factor login (TOTP) with a recovery code
            SEMAPHORE_TOTP_ENABLED: "true"
            SEMAPHORE_TOTP_ALLOW_RECOVERY: "true"
            # Run at most 2 jobs at once; extra jobs wait in the queue
            SEMAPHORE_MAX_PARALLEL_TASKS: "2"
        volumes:
            - semaphore_data:/var/lib/semaphore
            - semaphore_config:/etc/semaphore
            - semaphore_tmp:/tmp/semaphore
volumes:
    semaphore_data:
    semaphore_config:
    semaphore_tmp:
